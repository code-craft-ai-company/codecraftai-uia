name: Merge Gate

# Runs on every push and pull request to main, and on demand. One job per
# operating system: the suite is expected to work on Linux, macOS and Windows.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # Let every OS finish so one platform failure does not hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']

    defaults:
      run:
        # bash on every runner (Git Bash on Windows) so the steps below are
        # written once.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        # pipx is preinstalled on all three runner images.
        run: pipx install poetry

      - name: Print Python Version
        run: python -c "import sys; print(sys.version)"

      - name: Configure Git Store
        run: git config --global credential.helper store

      - name: Set the Github Token
        run: echo "https://git:${{ secrets.CCAI_ACCESS_TOKEN }}@github.com" > ~/.git-credentials

      - name: Re-Home the Repository
        run: |
          python ./repository-setup/rehome-repository
          cat ./.env

      - name: Install native build dependencies (cairo, gobject-introspection)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config libgirepository-2.0-dev libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core xvfb dbus-x11 python3-pyatspi python3-gi gnome-calculator openbox

      - name: Install native build dependencies (cairo, gobject-introspection)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config gobject-introspection gtk+3

      - name: Let the virtual environment see system packages (pyatspi is not on PyPI)
        if: runner.os == 'Linux'
        run: poetry config virtualenvs.options.system-site-packages true

      - name: Lint - exception-handling gate
        # A bare `except:` swallows ConfigurationError and SemanticError, which
        # derive from BaseException so that they end a run. See
        # userguide/10-00-coding-standards.rst, exception-handling rules 5-7.
        # pipx run avoids installing into the runner's system python (PEP 668).
        run: pipx run ruff check --select E722 .

      - name: Setup the Virtual Environment
        run: |
          python ./development/setup-environment
          poetry install --all-extras

      - name: Run Tests
        # On Linux the accessibility agent needs a display and an AT-SPI bus;
        # xvfb and a private D-Bus session provide them. macOS and Windows run
        # the same suite directly; tests that need a platform they are not on
        # raise SkipError.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a dbus-run-session -- bash -c '(openbox &) ; sleep 1; source ./.venv/bin/activate && testbase testing run --root ./source/testroots/ccai --includes=ccai.tests.singlehost'
          else
            source ./.venv/bin/activate 2>/dev/null || source ./.venv/Scripts/activate
            set -a; . ./.env; set +a
            testbase testing run --root ./source/testroots/ccai --includes=ccai.tests.singlehost
          fi

      - name: Show UI test diagnostics
        if: failure() && runner.os == 'Linux'
        run: |
          echo "### calculator debug log"; cat /tmp/calc_debug.log 2>/dev/null || echo "(none)"
          echo "### captured test output"
          find ~/ccai/results/testresults -type f \( -name "*.log" -o -name "*.txt" -o -name "stdout*" -o -name "stderr*" \) -size +0 2>/dev/null | head -40 | while read f; do echo "--- $f"; head -c 4000 "$f"; echo; done
