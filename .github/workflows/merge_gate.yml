# This is a basic workflow to help you get started with Actions

name: Merge Gate

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.10']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - uses: Gr1N/setup-poetry@v8

      - name: Print Python Version
        run: python3 -c "import sys; print(sys.version)"

      - name: Configure Git Store
        run: git config --global credential.helper store

      - name: Set the Github Token
        run: echo "https://git:${{ secrets.CCAI_ACCESS_TOKEN }}@github.com" > ~/.git-credentials

      - name: Re-Home the Repository
        run: |
          ./repository-setup/rehome-repository
          cat ./.env

      - name: Install native build dependencies (cairo, gobject-introspection)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev pkg-config libgirepository-2.0-dev libgirepository1.0-dev gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core xvfb dbus-x11 python3-pyatspi python3-gi

      - name: Install native build dependencies (cairo, gobject-introspection)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config gobject-introspection gtk+3

      - name: Let the virtual environment see system packages (pyatspi is not on PyPI)
        if: runner.os == 'Linux'
        run: poetry config virtualenvs.options.system-site-packages true

      - name: Configure the package index credential
        run: poetry config http-basic.codecraftai deployment "${{ secrets.CCAI_ORG_READ_TOKEN }}"

      - name: Setup the Virtual Environment
        run: |
          ./development/setup-environment
          poetry install --all-extras
      
      - name: Run Tests
        # The accessibility agent needs a display and an AT-SPI bus; xvfb and a private D-Bus session provide them.
        run: |
          xvfb-run -a dbus-run-session -- bash -c 'source ./.venv/bin/activate && testbase testing run --root ./source/testroots/ccai --includes=ccai.tests.singlehost'
