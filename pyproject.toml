[tool.poetry]
name = "codecraftai-uia"
description = "The Code Craft AI - User Interface Automation Package"
version = "1.0.5"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS :: MacOS X"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-this-app = { version = "<2.0.0", source = "codecraftai" }
codecraftai-arcli = { version = "<2.0.0", source = "codecraftai" }
codecraftai-foundations = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
pyyaml = "^6.0.1"
pyobjc-core = { version="^11.1", platform="darwin" }
pyobjc-framework-scriptingbridge = { version="^11.1", platform="darwin" }
pyobjc-framework-cocoa = { version="^11.1", platform="darwin" }
pyobjc-framework-applicationservices = { version="^11.1", platform="darwin" }
pyobjc-framework-applescriptkit = { version="^11.1", platform="darwin" }
pywin32 = { version="310", platform="win32" }
uiautomation = { version="2.0.28", platform="win32" }
pygobject = { version="^3.42.0", platform="linux" }
python-xlib = { version="^0.33", platform="linux" }

[tool.poetry.scripts]
uia = "ccai.uia.cli.uia_command:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
codecraftai-testbase = { version = "<2.0.0", source = "codecraftai" }
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
