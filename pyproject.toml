[project]
name = "codecraftai-uia"
version = "1.5.0"
description = "The Code Craft AI - User Interface Automation Package"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = [{name = "Myron Walker", email = "myron.walker@gmail.com"}]
keywords = [
    "python"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "codecraftai-this-app<2.0.0",
    "codecraftai-arcli<2.0.0",
    "codecraftai-foundations<2.0.0",
    "codecraftai-credentials<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pyobjc-core>=11.1,<12.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-scriptingbridge>=11.1,<12.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=11.1,<12.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-applicationservices>=11.1,<12.0.0; sys_platform == 'darwin'",
    "pywin32==310; sys_platform == 'win32'",
    "uiautomation==2.0.28; sys_platform == 'win32'",
    "pygobject>=3.42.0,<4.0.0; sys_platform == 'linux'",
    "python-xlib>=0.33,<0.34.0; sys_platform == 'linux'",
]

[project.scripts]
uia = "ccai.uia.cli.uia_command:main"

[project.urls]
Repository = "https://github.com/code-craft-ai-company/codecraftai-uia"
Issues = "https://github.com/code-craft-ai-company/codecraftai-uia/issues"

[dependency-groups]
dev = [
    "codecraftai-testbase<2.0.0",
    "myst-parser>=0.18.1,<0.19.0",
    "sphinx>=1.6,<6",
    "sphinx-rtd-theme>=1.1.1,<2.0.0",
]

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
codecraftai-this-app = {source = "codecraftai"}
codecraftai-arcli = {source = "codecraftai"}
codecraftai-foundations = {source = "codecraftai"}
codecraftai-credentials = {source = "codecraftai"}

[tool.poetry.group.dev.dependencies]
codecraftai-testbase = {source = "codecraftai"}

[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[[tool.uv.index]]
# Same licensed index as [[tool.poetry.source]]. Listed before PyPI so that
# codecraftai-* packages (direct and transitive) resolve from it; everything
# else falls through to PyPI. Credentials: UV_INDEX_CODECRAFTAI_USERNAME /
# UV_INDEX_CODECRAFTAI_PASSWORD, or `uv auth login`.
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
