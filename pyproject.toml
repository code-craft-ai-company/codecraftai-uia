[tool.poetry]
name = "automojo-uia"
description = "The Automation Mojo - User Interface Automation Package"
version = "0.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
automojo-this-app = { git = "https://github.com/automationmojo/automojo-this-app.git", branch = "main" }
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-credentials = { git = "https://github.com/automationmojo/automojo-credentials.git", branch = "main" }
automojo-testbase = { git = "https://github.com/automationmojo/automojo-testbase.git", branch = "main" }
pyobjc-core = { version="^11.1", platform="darwin" }
pyobjc-framework-scriptingbridge = { version="^11.1", platform="darwin" }
pyobjc-framework-cocoa = { version="^11.1", platform="darwin" }
pyobjc-framework-applicationservices = { version="^11.1", platform="darwin" }
pyobjc-framework-applescriptkit = { version="^11.1", platform="darwin" }
pywin32 = { version="310", platform="win32" }
uiautomation = { version="2.0.28", platform="win32" }


[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
