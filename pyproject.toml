[tool.poetry]
name = "codecraftai-uia"
description = "The Code Craft AI - User Interface Automation Package"
version = "0.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
codecraftai-this-app = { git = "https://github.com/automationmojo/codecraftai-this-app.git", branch = "main" }
codecraftai-arcli = { git = 'https://github.com/automationmojo/codecraftai-arcli.git', branch = "main" }
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", branch = "main" }
codecraftai-credentials = { git = "https://github.com/automationmojo/codecraftai-credentials.git", branch = "main" }
codecraftai-testbase = { git = "https://github.com/automationmojo/codecraftai-testbase.git", branch = "main" }
pyobjc-core = { version="^11.1", platform="darwin" }
pyobjc-framework-scriptingbridge = { version="^11.1", platform="darwin" }
pyobjc-framework-cocoa = { version="^11.1", platform="darwin" }
pyobjc-framework-applicationservices = { version="^11.1", platform="darwin" }
pyobjc-framework-applescriptkit = { version="^11.1", platform="darwin" }
pywin32 = { version="310", platform="win32" }
uiautomation = { version="2.0.28", platform="win32" }
pygobject = { version="^3.42.0", platform="linux" }

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
